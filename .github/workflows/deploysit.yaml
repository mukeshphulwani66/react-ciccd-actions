name: Deploy Site  # name of workflow
#on: [push, workflow_dispatch]   #when this workflow should run
# on:
#     - push
#     - workflow_dispatch
on:
    push:
        branches:
            - main
            - test
        paths-ignore:
            - README.md
            # - .github/workflows/*
    workflow_dispatch:
jobs:
    test:
        runs-on: ubuntu-latest
        steps:
            - name: "get code for testing"
              uses: actions/checkout@v7


            #   run: |
            #       echo "clone repository"
            #       echo "${{ toJSON(github) }}"
            #       git clone https://github.com/${{ github.repository }}.git
            - name: "install node 20"
              uses: actions/setup-node@v4
              with:
                  node-version: 20  
            - name: cache dependencies
              uses: actions/cache@v4
              with:
                  path: ~/.npm
                  key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
            - name: print node version
              run: |
                  node -v
            - name: install dependencies
              run: |
                  npm ci
    build:
        needs: test
        runs-on: ubuntu-latest
        steps:
            - name: "get code for build"
              uses: actions/checkout@v7

            - name: "install node 20"
              uses: actions/setup-node@v4
              with:
                  node-version: 20  
            - name: cache dependencies
              uses: actions/cache@v4
              with:
                  path: ~/.npm
                  key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
            - name: print node version
              run: |
                  node -v
            - name: install dependencies
              run: |
                  npm ci
            - name: build project
              run: |
                  npm run build
            - name: upload build artifacts
              uses: actions/upload-artifact@v4
              with:
                  name: build
                  path: |
                      dist
    deploy:
        needs: build
        runs-on: ubuntu-latest
        steps:
            - name: download build artifacts
              uses: actions/download-artifact@v4
              with:
                  name: build
                  path: |
                      dist
            - name: deploy project
              run: |
                  echo "Deploying project..."